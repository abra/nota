name: preferences_service
description: "User preferences: model, storage, repository, service and scope"
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.0.0
  # 2.5.0 crashes release builds at start: R8 renames the Kotlin classes its
  # JNI bindings look up by name (flutter/flutter#194649). Lift the cap once
  # a fixed version ships.
  shared_preferences_android: ">=2.4.28 <2.5.0"
  shared:
    path: ../shared

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.1
